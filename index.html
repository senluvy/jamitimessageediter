<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구버전 아이메시지 스킨 에디터</title>
<style>
:root{
  --accent:#3e76cb;
  --line:#d5dde7;
  --muted:#737e8c;
  --bubble:#3e76cb;
  --bg1:#c7d0df;
  --bg2:#aab7c8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:#20262d}
body{background:#f4f6f9}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1120px;margin:0 auto;padding:24px}

/* top */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}
.app-icon{width:40px;height:48px;border-radius:6px;border:1px solid #7d98b8;background:linear-gradient(145deg,#dce7f1,#4f7ca8);box-shadow:0 2px 7px rgba(80,102,126,.28);position:relative}
.app-icon:before{content:"";position:absolute;left:6px;right:6px;top:7px;height:17px;border-radius:2px;background:#31587e}
.app-icon:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;left:14px;bottom:8px;background:#dce8f1;border:1px solid #8099b0}
h1{font-size:22px;line-height:1.2;margin:0 0 5px;font-weight:800;letter-spacing:-1px}
.subtitle{font-size:13px;color:#505b68}
.exports{display:flex;gap:10px}
.export-btn{height:44px;padding:0 19px;border:1px solid #7f9dc3;border-radius:8px;background:#f8fafc;color:#3d6192;font-weight:700}
.export-btn:hover{background:#edf4fc}
.export-btn:disabled{opacity:.55;cursor:wait}

/* layout */
.layout{display:grid;grid-template-columns:360px 1fr;gap:12px}
.editor,.preview-panel{border:1px solid #cfd8e4;border-radius:10px;background:rgba(255,255,255,.58);box-shadow:0 2px 10px rgba(34,54,76,.045)}
.editor{overflow:hidden}
.section{padding:17px 18px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section-title{font-size:15px;font-weight:800;margin:0 0 10px}
.section-help{font-size:12px;color:var(--muted);margin:-1px 0 12px}
.field{margin:9px 0}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#3f4854}
.field input,.field textarea,.field select{width:100%;border:1px solid #ccd6e2;border-radius:6px;padding:8px 9px;background:#fff;color:#27313b}
.field textarea{resize:vertical;min-height:64px}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color-row{display:grid;grid-template-columns:122px 1fr;gap:8px;align-items:center}
.color-row label{margin:0}
.color-row input[type=color]{height:35px;padding:3px}
.small-btn,.add-btn{border:1px solid #a9bdd8;background:#f8fbff;color:#42699d;border-radius:6px;padding:7px 9px;font-size:12px;font-weight:700}
.small-btn.danger{border-color:#e0a7a7;color:#a34d4d;background:#fffafa}
.add-btn{width:100%;margin-top:4px}
.message-card{border:1px solid #d8dfe8;border-radius:8px;padding:10px;margin:10px 0;background:#fbfcfd}
.message-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}

/* compact profile */
.profile-section{padding-top:15px;padding-bottom:15px}
.profile-compact{display:grid;grid-template-columns:102px 1fr;gap:13px;align-items:center}
.compact-preview{display:flex;flex-direction:column;align-items:center;gap:6px}
.avatar-box{width:62px;height:62px;position:relative}
.profile-thumb,.editor-placeholder{width:62px;height:62px;border-radius:50%;object-fit:cover;border:1px solid #cbd3dd;background:#d8dce1;display:block}
.editor-placeholder:before{content:"";display:block;width:24px;height:24px;border-radius:50%;background:#6e747a;margin:10px auto 3px}
.editor-placeholder:after{content:"";display:block;width:42px;height:19px;border-radius:22px 22px 8px 8px;background:#6e747a;margin:auto}
.bubble.left,.bubble.right{clip-path:none!important;border-radius:17px!important;padding:8px 11px!important}.bubble{position:relative!important;z-index:1!important;isolation:isolate;overflow:visible!important}.bubble .tail{position:absolute!important;display:block!important;width:12px!important;height:12px!important;bottom:5px!important;z-index:-1!important;transform:rotate(45deg);pointer-events:none}.bubble.left .tail{left:-6px!important;background:#e4e4e4!important;border-left:1px solid #a9afb6!important;border-bottom:1px solid #a9afb6!important}.bubble.right .tail{right:-6px!important;background:color-mix(in srgb,var(--bubble) 76%,#173f75)!important;border-right:1px solid color-mix(in srgb,var(--bubble) 62%,#1a416f)!important;border-bottom:1px solid color-mix(in srgb,var(--bubble) 62%,#1a416f)!important}.tail,.bubble .tail,.bubble.left .tail,.bubble.right .tail{display:none!important;visibility:hidden!important}.hidden{display:none!important}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upload-label{display:inline-block;padding:5px 8px}
.profile-hint{font-size:10px;color:#7b8794;text-align:center}
.profile-fields .field{margin:5px 0}

/* preview */
.preview-panel{padding:20px;min-height:820px}
.preview-title{font-size:16px;font-weight:800;margin-bottom:7px}
.preview-help{font-size:12px;color:#7b8490}
.phone-wrap{display:flex;justify-content:center;align-items:flex-start;padding:28px 0 10px}
.phone{
  width:348px;height:742px;position:relative;flex:0 0 348px;
  border-radius:48px;padding:8px;background:#050607;
  border:2px solid #77808a;box-shadow:0 6px 14px rgba(0,0,0,.28);
}
.phone.white{background:#f6f6f6;border-color:#737373}
.phone-speaker{position:absolute;width:76px;height:5px;border-radius:4px;top:54px;left:50%;transform:translateX(-50%);background:#25282c;z-index:5}
.phone.white .phone-speaker{background:#aeb4ba}
.camera{position:absolute;width:13px;height:13px;border-radius:50%;top:29px;left:50%;transform:translateX(-50%);background:#111b27;z-index:5}
.phone.white .camera{background:#9aa2ab}
.screen{position:absolute;left:18px;right:18px;top:99px;bottom:96px;border:2px solid #303840;overflow:hidden;background:#c8d0dc}
.phone.white .screen{border-color:#777}
.home{position:absolute;width:68px;height:68px;border-radius:50%;bottom:16px;left:50%;transform:translateX(-50%);border:3px solid #3d454e;box-shadow:inset 0 0 0 1px #16191d}
.phone.white .home{border-color:#9ba3ab;box-shadow:inset 0 0 0 1px #ddd}

.imsg{height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg1),var(--bg2))}
.statusbar{height:3px;flex:0 0 3px}
.header{padding:2px 10px 5px;border-bottom:1px solid rgba(65,76,89,.18);background:rgba(255,255,255,.10)}
.nav{height:26px;display:flex;align-items:center;color:#252a30}
.back{font-size:22px;line-height:1;margin-right:2px}
.unread{font-size:14px;line-height:1;margin-top:1px}
.contact{text-align:center;padding-bottom:4px}
.contact img,.contact-placeholder{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#c9ccd0;display:block;margin:0 auto 2px}
.contact-placeholder:before{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#74777b;margin:7px auto 2px}
.contact-placeholder:after{content:"";display:block;width:32px;height:14px;border-radius:18px 18px 6px 6px;background:#74777b;margin:auto}
.contact-name{font-weight:800;font-size:13px;line-height:1.1}
.date{font-size:9px;color:#67717c;margin-top:4px}
.messages{flex:1;min-height:0;overflow-y:auto;padding:9px 11px 7px;scrollbar-width:thin}
.bubble-row{display:flex;align-items:flex-end;gap:5px;margin:9px 0}
.bubble-row.right{justify-content:flex-end}
.bubble-row.left{justify-content:flex-start}
.bubble{
  position:relative;max-width:76%;padding:8px 11px;border-radius:17px;
  font-size:11px;line-height:1.25;white-space:pre-wrap;word-break:break-word;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(0,0,0,.22);
  z-index:1;
}
.bubble.left{
  color:#30343a;border:1px solid #a9afb6;
  background:linear-gradient(180deg,#fff 0%,#f4f4f4 60%,#dedede 100%);
}
.bubble.right{
  color:#fff;border:1px solid color-mix(in srgb,var(--bubble) 62%,#1a416f);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--bubble) 68%,#fff) 0%,
    var(--bubble) 48%,
    color-mix(in srgb,var(--bubble) 72%,#153d72) 100%);
  text-shadow:0 1px 0 rgba(0,0,0,.14);
}

/* 안정적인 꼬리: 회전된 작은 정사각형 + 본문에 가려지는 부분 */
.tail{position:absolute;bottom:2px;width:14px;height:18px;overflow:visible;pointer-events:none;z-index:0}
.bubble.left .tail{left:-8px}.bubble.right .tail{right:-8px}
.tail svg{display:block;width:100%;height:100%;overflow:visible}
.bubble-text,.shared-image{position:relative;z-index:1}
.bubble-text,.shared-image{position:relative;z-index:2}
.time{font-size:8px;color:#68727c;white-space:nowrap;margin-bottom:3px}
.shared-image{max-width:100%;display:block;border-radius:10px;margin-top:6px}
.composer{flex:0 0 auto;border-top:2px solid #434a50;background:#f4f4f4;padding:7px 9px;display:flex;align-items:center;gap:8px}
.plus{font-size:28px;line-height:25px;color:#1e252b}
.input-pill{height:29px;flex:1;border-radius:15px;background:#dedede;padding:5px 12px;font-size:15px;font-family:cursive;color:#222}
.footer{font-size:12px;color:#77818c;text-align:right;margin-top:12px}

@media(max-width:850px){
  .app{padding:14px}.topbar{flex-direction:column}.layout{grid-template-columns:1fr}.preview-panel{min-height:auto}
  .phone{transform:scale(.9);transform-origin:top center;margin-bottom:-74px}
}
@media(max-width:460px){
  .exports{width:100%}.export-btn{flex:1;padding:0 8px}
  .profile-compact{grid-template-columns:90px 1fr}
  .phone{transform:scale(.78);margin-bottom:-145px}
}

/* ===== 말풍선 본체 복원 =====
   꼬리 실루엣 때문에 본체 모양을 clip-path로 자르지 않습니다.
   기존의 둥근 사각형 본체를 그대로 유지합니다. */
.bubble.left,
.bubble.right{
  clip-path:none!important;
  border-radius:17px!important;
  padding:8px 11px!important;
}

/* 별도 통합형 꼬리 규칙이 남아 있더라도 무효화 */
.bubble.left{clip-path:none!important}
.bubble.right{clip-path:none!important}


/* ===== 말풍선 꼬리 레이어 수정 =====
   본체는 위, 꼬리는 같은 stacking context 안에서 바로 아래에 배치 */
.bubble{
  position:relative !important;
  z-index:1 !important;
  isolation:isolate;
  overflow:visible !important;
}

/* 꼬리 자체는 말풍선 본체 아래 레이어 */
.bubble .tail{
  position:absolute !important;
  display:block !important;
  width:12px !important;
  height:12px !important;
  bottom:5px !important;
  z-index:-1 !important;
  transform:rotate(45deg);
  pointer-events:none;
}

.bubble.left .tail{
  left:-6px !important;
  background:#e4e4e4 !important;
  border-left:1px solid #a9afb6 !important;
  border-bottom:1px solid #a9afb6 !important;
}

.bubble.right .tail{
  right:-6px !important;
  background:color-mix(in srgb,var(--bubble) 76%,#173f75) !important;
  border-right:1px solid color-mix(in srgb,var(--bubble) 62%,#1a416f) !important;
  border-bottom:1px solid color-mix(in srgb,var(--bubble) 62%,#1a416f) !important;
}


/* ===== 말풍선 꼬리 완전 제거 ===== */
.tail,
.bubble .tail,
.bubble.left .tail,
.bubble.right .tail{
  display:none!important;
  visibility:hidden!important;
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="app-icon"></div>
      <div><h1>구버전 아이메시지 스킨 에디터</h1><div class="subtitle">편집 및 미리보기</div></div>
    </div>
    <div class="exports">
      <button class="export-btn" id="htmlExport">⌘ &nbsp;HTML 내보내기</button>
      <button class="export-btn" id="pngExport">⇩ &nbsp;PNG 저장</button>
    </div>
  </header>

  <main class="layout">
    <aside class="editor">
      <section class="section profile-section">
        <h2 class="section-title">1. 프로필 편집</h2>
        <div class="profile-compact">
          <div class="compact-preview">
            <div class="avatar-box">
              <div class="editor-placeholder" id="editorAvatarPlaceholder"></div>
              <img class="profile-thumb hidden" id="profileThumb" alt="">
            </div>
            <label for="profileImage" class="small-btn upload-label">이미지 변경</label>
            <input class="hidden-file" type="file" id="profileImage" accept="image/*">
            <div class="profile-hint" id="profileHint">기본 이미지</div>
          </div>
          <div class="profile-fields">
            <div class="field"><label>프로필 이름</label><input id="profileName" value="재우 선배"></div>
            <div class="field"><label>읽지 않은 메시지 수</label><input id="unreadCount" type="number" min="0" value="105"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">2. 메시지 편집</h2>
        <div id="messageList"></div>
        <button class="add-btn" id="addMessage">＋ 말풍선 추가</button>
        <div class="field"><label>메시지 입력창 문구</label><input id="composerText" value="iMessage"></div>
      </section>

      <section class="section">
        <h2 class="section-title">3. 배경 편집</h2>
        <div class="section-help">아이폰과 메시지 화면의 색상을 설정하세요.</div>
        <div class="field color-row"><label>배경 상단 색상</label><input type="color" id="bgColor" value="#C7D0DF"></div>
        <div class="field color-row"><label>배경 하단 색상</label><input type="color" id="bgColor2" value="#AAB7C8"></div>
        <div class="field">
          <label>아이폰 베젤</label>
          <select id="bezelColor"><option value="black">블랙</option><option value="white">화이트</option></select>
        </div>
        <div class="field color-row"><label>우측 말풍선 색상</label><input type="color" id="bubbleColor" value="#3E76CB"></div>
      </section>
    </aside>

    <section class="preview-panel">
      <div class="preview-title">실시간 미리보기</div>
      <div class="preview-help">입력한 내용이 실시간으로 반영됩니다.</div>
      <div class="phone-wrap">
        <div class="phone" id="phone">
          <div class="camera"></div><div class="phone-speaker"></div>
          <div class="screen">
            <div class="imsg" id="imsg">
              <div class="statusbar"></div>
              <div class="header">
                <div class="nav"><span class="back">‹</span><span class="unread" id="previewUnread">105</span></div>
                <div class="contact">
                  <div class="contact-placeholder" id="contactPlaceholder"></div>
                  <img id="contactImage" class="hidden" alt="">
                  <div class="contact-name" id="previewName">재우 선배 ›</div>
              </div>
              <div class="messages" id="previewMessages"></div>
              <div class="composer"><div class="plus">＋</div><div class="input-pill" id="previewComposer">iMessage</div></div>
            </div>
          </div>
          <div class="home"></div>
        </div>
      </div>
    </section>
  </main>
  <div class="footer">© 2026 iMessage Skin Editor. All rights reserved.</div>
</div>

<script>
const state = {
  messages: [
    {side:'right', text:"선배! 선배는 제가 왜 좋아요?", time:'11:48 PM', showTime:true, image:null},
    {side:'left', text:"글쎄. 이유가 많이 중요해?", time:'11:49 PM', showTime:false, image:null},
    {side:'left', text:"에휴 선배가 그럼 그렇지. 그냥 신경쓰지 마세여", time:'11:49 PM', showTime:true, image:null},
    {side:'right', text:"고민해 봤는데, 여전히 잘 모르겠네. 그런데 진심으로 누군가를 좋아한다고 느꼈던 건 네가 처음이야. 시간 많이 늦었어. 잘 자.", time:'3:03 AM', showTime:true, image:null}
  ]
};

const $ = s => document.querySelector(s);
const phone = $('#phone');
const imsg = $('#imsg');
const previewMessages = $('#previewMessages');
const messageList = $('#messageList');
const contactImage = $('#contactImage');
const contactPlaceholder = $('#contactPlaceholder');
const profileThumb = $('#profileThumb');
const editorAvatarPlaceholder = $('#editorAvatarPlaceholder');

function renderPreviewMessages(){
  previewMessages.innerHTML = '';
  state.messages.forEach(m => {
    const row = document.createElement('div');
    row.className = `bubble-row ${m.side}`;

    const bubble = document.createElement('div');
    bubble.className = `bubble ${m.side}`;

    const tail = document.createElement('span');
    tail.className = 'tail';
    if(m.side === 'left'){
      tail.innerHTML = '<svg viewBox="0 0 14 18" aria-hidden="true"><defs><linearGradient id="ltail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dedede"/></linearGradient></defs><path d="M13 1 C9 5 7 9 2 15 C5 16 9 16 13 15 Z" fill="url(#ltail)" stroke="#a9afb6" stroke-width="1" stroke-linejoin="round"/></svg>';
    } else {
      const c = getComputedStyle(document.documentElement).getPropertyValue('--bubble').trim() || '#3e76cb';
      tail.innerHTML = `<svg viewBox="0 0 14 18" aria-hidden="true"><defs><linearGradient id="rtail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="#173f75"/></linearGradient></defs><path d="M1 1 C5 5 7 9 12 15 C9 16 5 16 1 15 Z" fill="url(#rtail)" stroke="#1a416f" stroke-width="1" stroke-linejoin="round"/></svg>`;
    }
    bubble.appendChild(tail);

    const text = document.createElement('span');
    text.className = 'bubble-text';
    text.textContent = m.text;
    bubble.appendChild(text);

    if(m.image){
      const img = document.createElement('img');
      img.className = 'shared-image';
      img.src = m.image;
      img.alt = '';
      bubble.appendChild(img);
    }

    if(m.side === 'left'){
      row.appendChild(bubble);
      if(m.showTime){
        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = m.time;
        row.appendChild(time);
      }
    }else{
      if(m.showTime){
        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = m.time;
        row.appendChild(time);
      }
      row.appendChild(bubble);
    }
    previewMessages.appendChild(row);
  });
}

function renderMessageEditors(){
  messageList.innerHTML = '';
  state.messages.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'message-card';
    card.innerHTML = `
      <div class="message-card-head">
        <b style="font-size:12px">${i+1}. 말풍선</b>
        <button class="small-btn danger" data-delete="${i}" ${state.messages.length === 1 ? 'disabled' : ''}>삭제</button>
      </div>
      <div class="inline">
        <div class="field"><label>위치</label>
          <select data-side="${i}">
            <option value="left">좌측</option><option value="right">우측</option>
          </select>
        </div>
        <div class="field"><label>시간 표시</label>
          <select data-show="${i}">
            <option value="true">표시</option><option value="false">숨김</option>
          </select>
        </div>
      </div>
      <div class="field"><label>메시지</label><textarea data-text="${i}"></textarea></div>
      <div class="inline">
        <div class="field"><label>시간 HH:MM AM/PM</label><input data-time="${i}" placeholder="11:49 PM"></div>
        <div class="field"><label>이미지 공유</label><input type="file" accept="image/*" data-image="${i}"></div>
      </div>
    `;
    messageList.appendChild(card);
    card.querySelector(`[data-side="${i}"]`).value = m.side;
    card.querySelector(`[data-show="${i}"]`).value = String(m.showTime);
    card.querySelector(`[data-text="${i}"]`).value = m.text;
    card.querySelector(`[data-time="${i}"]`).value = m.time;
  });
}

function renderAllMessages(){
  renderPreviewMessages();
  renderMessageEditors();
}

messageList.addEventListener('input', e => {
  const i = Number(e.target.dataset.text ?? e.target.dataset.time);
  if(Number.isNaN(i)) return;
  if(e.target.dataset.text !== undefined) state.messages[i].text = e.target.value;
  if(e.target.dataset.time !== undefined) state.messages[i].time = e.target.value;
  renderPreviewMessages();
});

messageList.addEventListener('change', e => {
  if(e.target.dataset.side !== undefined){
    state.messages[Number(e.target.dataset.side)].side = e.target.value;
    renderAllMessages();
  }
  if(e.target.dataset.show !== undefined){
    state.messages[Number(e.target.dataset.show)].showTime = e.target.value === 'true';
    renderAllMessages();
  }
  if(e.target.dataset.image !== undefined && e.target.files && e.target.files[0]){
    const i = Number(e.target.dataset.image);
    const reader = new FileReader();
    reader.onload = () => {
      state.messages[i].image = reader.result;
      renderPreviewMessages();
    };
    reader.readAsDataURL(e.target.files[0]);
  }
});

messageList.addEventListener('click', e => {
  if(e.target.dataset.delete !== undefined && state.messages.length > 1){
    state.messages.splice(Number(e.target.dataset.delete), 1);
    renderAllMessages();
  }
});

$('#addMessage').addEventListener('click', () => {
  state.messages.push({
    side:'left', text:'새 메시지를 입력하세요.', time:'11:49 PM', showTime:true, image:null
  });
  renderAllMessages();
});

$('#profileImage').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const src = reader.result;
    contactImage.src = src;
    profileThumb.src = src;
    contactImage.classList.remove('hidden');
    profileThumb.classList.remove('hidden');
    contactPlaceholder.classList.add('hidden');
    editorAvatarPlaceholder.classList.add('hidden');
    $('#profileHint').textContent = '이미지 적용됨';
  };
  reader.readAsDataURL(file);
});

$('#bgColor2').addEventListener('input', () => {

/* PNG export */
function ensureHtml2Canvas(){
  return new Promise((resolve, reject) => {
    if(window.html2canvas) return resolve(window.html2canvas);
    const existing = document.querySelector('script[data-html2canvas]');
    if(existing){
      existing.addEventListener('load', () => resolve(window.html2canvas), {once:true});
      existing.addEventListener('error', () => reject(new Error('라이브러리 로드 실패')), {once:true});
      return;
    }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    script.dataset.html2canvas = 'true';
    script.onload = () => window.html2canvas ? resolve(window.html2canvas) : reject(new Error('html2canvas를 찾을 수 없습니다.'));
    script.onerror = () => reject(new Error('PNG 저장 라이브러리를 불러오지 못했습니다.'));
    document.head.appendChild(script);
  });
}

function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

$('#pngExport').addEventListener('click', async () => {
  const btn = $('#pngExport');
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'PNG 생성 중...';
  try{
    const html2canvas = await ensureHtml2Canvas();
    const canvas = await html2canvas(phone, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      allowTaint: false,
      logging: false,
      scrollX: 0,
      scrollY: 0
    });
    canvas.toBlob(blob => {
      if(!blob) throw new Error('PNG 생성에 실패했습니다.');
      saveBlob(blob, 'imessage-skin.png');
    }, 'image/png');
  }catch(err){
    console.error(err);
    alert('PNG 저장 중 오류가 발생했습니다. 인터넷 연결 후 다시 시도해 주세요.');
  }finally{
    btn.disabled = false;
    btn.textContent = oldText;
  }
});

.statusbar{height:3px;flex:0 0 3px}.header{padding:2px 10px 5px;border-bottom:1px solid rgba(65,76,89,.18);background:rgba(255,255,255,.1)}.nav{height:26px;display:flex;align-items:center;color:#252a30}.back{font-size:22px;line-height:1;margin-right:2px}.unread{font-size:14px;line-height:1}

.bubble.left{color:#30343a;border:1px solid #a9afb6;background:linear-gradient(180deg,#fff 0%,#f4f4f4 60%,#dedede 100%)}.bubble.right{color:#fff;border:1px solid #1a416f;background:linear-gradient(180deg,color-mix(in srgb,${bubble} 68%,#fff) 0%,${bubble} 48%,color-mix(in srgb,${bubble} 72%,#153d72) 100%);text-shadow:0 1px 0 rgba(0,0,0,.14)}
.tail{position:absolute;bottom:2px;width:14px;height:18px;overflow:visible;pointer-events:none;z-index:0}.bubble.left .tail{left:-8px}.bubble.right .tail{right:-8px}.tail svg{display:block;width:100%;height:100%;overflow:visible}.bubble-text,.shared-image{position:relative;z-index:1}.time{font-size:8px;color:#68727c;white-space:nowrap;margin-bottom:3px}.shared-image{max-width:100%;display:block;border-radius:10px;margin-top:6px}
.composer{flex:0 0 auto;border-top:2px solid #434a50;background:#f4f4f4;padding:7px 9px;display:flex;align-items:center;gap:8px}.plus{font-size:28px;line-height:25px;color:#1e252b}.input-pill{height:29px;flex:1;border-radius:15px;background:#dedede;padding:5px 12px;font-size:15px;font-family:cursive;color:#222}

`;

  const doc = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>iMessage Skin</title><style>${css}
/* ===== 말풍선 본체 복원 =====
   꼬리 실루엣 때문에 본체 모양을 clip-path로 자르지 않습니다.

.bubble.left,
