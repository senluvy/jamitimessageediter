<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구버전 아이메시지 스킨 에디터</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --accent:#3E76CB;
  --accent-dark:#2B5FA3;
  --panel:#ffffff;
  --line:#d9e0ea;
  --muted:#6f7a88;
  --page:#f5f6f8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:#20252b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1120px;margin:0 auto;padding:24px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
.brand{display:flex;gap:14px;align-items:center}
.app-icon{width:40px;height:48px;border-radius:6px;border:1px solid #8097b2;background:linear-gradient(145deg,#dce6f0,#4d7ba8);box-shadow:0 2px 7px #aab4c0;position:relative}
.app-icon:before{content:"";position:absolute;left:6px;right:6px;top:7px;height:17px;border-radius:2px;background:#31587e}
.app-icon:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;left:15px;bottom:8px;background:#d9e7f2;border:1px solid #7d97b1}
h1{font-size:22px;margin:0 0 6px;font-weight:800;letter-spacing:-1px}
.subtitle{font-size:13px;color:#505a67}
.exports{display:flex;gap:10px}
.export-btn{height:44px;padding:0 18px;border:1px solid #7f9dc3;border-radius:8px;background:#f8fafc;color:#3b6092;font-weight:700;letter-spacing:.2px}
.export-btn:hover{background:#edf3fb}
.layout{display:grid;grid-template-columns:360px 1fr;gap:12px}
.editor,.preview-panel{border:1px solid #cfd7e2;border-radius:10px;background:rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(34,54,76,.05)}
.editor{overflow:hidden}
.section{padding:18px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section-title{font-size:15px;font-weight:800;margin:0 0 10px}
.section-help{font-size:12px;color:var(--muted);margin:-2px 0 14px}
.field{margin:10px 0}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#3f4854}
.field input,.field textarea,.field select{width:100%;border:1px solid #ccd5e0;border-radius:6px;padding:9px 10px;background:#fff;color:#27313b}
.field textarea{resize:vertical;min-height:66px}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color-row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}
.color-row input[type=color]{height:36px;padding:3px}
.check-row{display:flex;align-items:center;gap:8px;font-size:12px}
.profile-preview{display:flex;align-items:center;gap:10px;margin-top:8px}
.profile-thumb{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #cbd3dd;background:#e9edf2}
.message-card{border:1px solid #d8dfe8;border-radius:8px;padding:10px;margin:10px 0;background:#fbfcfd}
.message-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.small-btn,.add-btn{border:1px solid #a9bdd8;background:#f8fbff;color:#42699d;border-radius:6px;padding:7px 9px;font-size:12px;font-weight:700}
.small-btn.danger{border-color:#e0a7a7;color:#a34d4d;background:#fffafa}
.add-btn{width:100%;margin-top:4px}
.preview-panel{padding:20px;min-height:820px;position:relative}
.preview-title{font-size:16px;font-weight:800;margin-bottom:7px}
.preview-help{font-size:12px;color:#7b8490}
.phone-wrap{display:flex;justify-content:center;padding:30px 0 10px}
.phone{width:348px;height:742px;border-radius:48px;padding:8px;background:#050607;border:2px solid #75808b;box-shadow:0 6px 14px rgba(0,0,0,.28);position:relative}
.phone.white{background:#f6f6f6;border-color:#727272}
.phone:before{content:"";position:absolute;width:76px;height:5px;border-radius:4px;top:54px;left:50%;transform:translateX(-50%);background:#25282c;z-index:3}
.phone.white:before{background:#aeb3b9}
.camera{position:absolute;width:13px;height:13px;border-radius:50%;top:29px;left:50%;transform:translateX(-50%);background:#0d1825;z-index:3}
.phone.white .camera{background:#9ca3ab}
.screen{position:absolute;left:18px;right:18px;top:99px;bottom:96px;border:2px solid #303840;overflow:hidden;background:#c8d0dc}
.phone.white .screen{border-color:#7b7b7b}
.home{position:absolute;width:68px;height:68px;border-radius:50%;bottom:16px;left:50%;transform:translateX(-50%);border:3px solid #3d454e;box-shadow:inset 0 0 0 1px #16191d}
.phone.white .home{border-color:#9ca3ad;box-shadow:inset 0 0 0 1px #d9d9d9}
.imsg{height:100%;display:flex;flex-direction:column;background:linear-gradient(#c9d2df,#aab7c8)}
.statusbar{height:8px;flex:0 0 8px}
.header{padding:7px 10px 0;border-bottom:1px solid rgba(65,76,89,.18);background:rgba(255,255,255,.12)}
.nav{height:34px;display:flex;align-items:center;justify-content:space-between;color:#252a30}
.back{font-size:24px;line-height:1}.unread{font-size:19px;margin-left:3px}
.header-icons{font-size:24px;letter-spacing:3px}
.contact{text-align:center;padding-bottom:7px}
.contact img,.contact-placeholder{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#c9ccd0;display:block;margin:0 auto 2px}
.contact-placeholder:before{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#74777b;margin:10px auto 2px}
.contact-placeholder:after{content:"";display:block;width:36px;height:16px;border-radius:20px 20px 6px 6px;background:#74777b;margin:auto}
.contact-name{font-weight:800;font-size:14px}.date{font-size:9px;color:#67717c;margin-top:5px}
.messages{flex:1;overflow-y:auto;padding:10px 9px 6px;scrollbar-width:thin}
.bubble-row{display:flex;align-items:flex-end;gap:5px;margin:7px 0}
.bubble-row.right{justify-content:flex-end}
.bubble-row.left{justify-content:flex-start}
.bubble{max-width:78%;padding:8px 10px;border-radius:17px;font-size:11px;line-height:1.22;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.bubble.left{background:linear-gradient(#ffffff,#e6e7e8);border:1px solid #9ba3aa;color:#32373b}
.bubble.right{color:#fff;background:linear-gradient(145deg,var(--bubble-color,#3e76cb),color-mix(in srgb,var(--bubble-color,#3e76cb) 65%,#183d73));border:1px solid color-mix(in srgb,var(--bubble-color,#3e76cb) 65%,#1d467d)}
.time{font-size:8px;color:#68727c;white-space:nowrap;margin-bottom:3px}
.shared-image{max-width:100%;display:block;border-radius:10px;margin-top:6px}
.composer{border-top:2px solid #434a50;background:#f4f4f4;padding:7px 9px;display:flex;align-items:center;gap:8px}
.plus{font-size:28px;line-height:25px;color:#1e252b}
.input-pill{height:29px;flex:1;border-radius:15px;background:#dedede;padding:5px 12px;font-size:15px;font-family:cursive;color:#222}
.footer{font-size:12px;color:#77818c;text-align:right;margin-top:12px}
.hidden{display:none!important}
@media(max-width:850px){.app{padding:14px}.topbar{flex-direction:column}.layout{grid-template-columns:1fr}.preview-panel{min-height:auto}.phone-wrap{padding-top:20px}.phone{transform:scale(.9);transform-origin:top center;margin-bottom:-74px}}
@media(max-width:420px){.exports{width:100%}.export-btn{flex:1;padding:0 8px}.phone{transform:scale(.78);margin-bottom:-145px}.editor{border-radius:8px}}

/* ===== compact profile ===== */
.profile-section{padding-top:16px;padding-bottom:16px}
.profile-compact{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center}
.profile-upload-wrap{min-width:0}
.compact-preview{margin:0;display:flex;flex-direction:column;align-items:center;gap:7px}
.compact-avatar-wrap{position:relative;width:66px;height:66px}
.compact-avatar{width:66px!important;height:66px!important;margin:0!important;border:1px solid #cbd3dd}
.compact-placeholder{width:66px!important;height:66px!important;margin:0!important}
.compact-placeholder:before{width:24px!important;height:24px!important;margin:12px auto 3px!important}
.compact-placeholder:after{width:42px!important;height:18px!important}
.hidden-file{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.upload-label{display:inline-block;padding:6px 8px;text-align:center}
.profile-hint{display:block;font-size:10px;color:#7c8794;margin-top:4px;text-align:center}
.profile-fields{display:grid;grid-template-columns:1fr;gap:2px}
.profile-fields .field{margin:4px 0}

/* ===== classic iMessage bubble ===== */
.bubble{
  position:relative;
  overflow:visible;
  max-width:76%;
  padding:8px 11px;
  border-radius:17px;
  font-size:11px;
  line-height:1.25;
  white-space:pre-wrap;
  word-break:break-word;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.58),
    0 1px 2px rgba(0,0,0,.22);
}
.bubble.left{
  background:linear-gradient(180deg,#ffffff 0%,#f4f4f4 58%,#dddddd 100%);
  border:1px solid #a8adb4;
  color:#30343a;
}
.bubble.left:after{
  content:"";
  position:absolute;
  left:-6px;
  bottom:5px;
  width:11px;
  height:14px;
  background:linear-gradient(135deg,#f0f0f0 0%,#e1e1e1 100%);
  border-left:1px solid #a8adb4;
  border-bottom:1px solid #a8adb4;
  transform:skewY(-28deg);
  border-bottom-left-radius:2px;
  z-index:0;
}
.bubble.left:before{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:8px;
  height:13px;
  background:linear-gradient(180deg,#f5f5f5,#dedede);
  z-index:1;
}
.bubble.right{
  color:#ffffff;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--bubble-color,#3e76cb) 72%,#ffffff) 0%,
      var(--bubble-color,#3e76cb) 48%,
      color-mix(in srgb,var(--bubble-color,#3e76cb) 72%,#123d78) 100%);
  border:1px solid color-mix(in srgb,var(--bubble-color,#3e76cb) 58%,#173d70);
  text-shadow:0 1px 0 rgba(0,0,0,.15);
}
.bubble.right:after{
  content:"";
  position:absolute;
  right:-6px;
  bottom:5px;
  width:11px;
  height:14px;
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--bubble-color,#3e76cb) 55%,#ffffff),
    color-mix(in srgb,var(--bubble-color,#3e76cb) 70%,#123d78));
  border-right:1px solid color-mix(in srgb,var(--bubble-color,#3e76cb) 58%,#173d70);
  border-bottom:1px solid color-mix(in srgb,var(--bubble-color,#3e76cb) 58%,#173d70);
  transform:skewY(28deg);
  border-bottom-right-radius:2px;
  z-index:0;
}
.bubble.right:before{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  width:8px;
  height:13px;
  background:color-mix(in srgb,var(--bubble-color,#3e76cb) 78%,#153e73);
  z-index:1;
}
.bubble > *{position:relative;z-index:2}
.bubble-row{margin:9px 0}
.shared-image{position:relative;z-index:2}

/* 연락처 영역도 조금 축소 */
.contact img,.contact-placeholder{width:48px;height:48px}
.contact-placeholder:before{margin:8px auto 2px}
.contact-placeholder:after{width:33px;height:15px}

/* 전화/통화 관련 기호 제거 */
.header-icons{display:none!important}
.nav{justify-content:flex-start}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="app-icon"></div><div><h1>구버전 아이메시지 스킨 에디터</h1><div class="subtitle">편집 및 미리보기</div></div></div>
    <div class="exports">
      <button class="export-btn" id="htmlExport">⌘ &nbsp;HTML 내보내기</button>
      <button class="export-btn" id="pngExport">⇩ &nbsp;PNG 저장</button>
    </div>
  </header>

  <main class="layout">
    <aside class="editor">
      <section class="section profile-section">
        <h2 class="section-title">1. 프로필 편집</h2>
        <div class="profile-compact">
          <div class="profile-upload-wrap">
            <div class="profile-preview compact-preview">
              <div class="compact-avatar-wrap">
                <div class="contact-placeholder compact-placeholder" id="editorAvatarPlaceholder"></div>
                <img class="profile-thumb compact-avatar hidden" id="profileThumb">
              </div>
              <div>
                <label for="profileImage" class="small-btn upload-label">이미지 변경</label>
                <input class="hidden-file" type="file" id="profileImage" accept="image/*">
                <span id="profileHint" class="profile-hint">기본 이미지</span>
              </div>
            </div>
          </div>
          <div class="profile-fields">
            <div class="field"><label>프로필 이름</label><input id="profileName" value="이름"></div>
            <div class="field"><label>읽지 않은 메시지 수</label><input id="unreadCount" type="number" min="0" value="105"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">2. 메시지 편집</h2>
        <div class="inline">
          <div class="field"><label>요일 (영문)</label><input id="dateDay" value="Thursday"></div>
          <div class="field"><label>날짜</label><input id="dateNum" value="20" type="number" min="1" max="31"></div>
        </div>
        <div class="inline">
          <div class="field"><label>월 (영문)</label><input id="dateMonth" value="April"></div>
          <div class="field"><label>년도</label><input id="dateYear" value="2017" type="number"></div>
        </div>
        <div id="messageList"></div>
        <button class="add-btn" id="addMessage">＋ 말풍선 추가</button>
        <div class="field"><label>메시지 입력창 문구</label><input id="composerText" value="iMessage"></div>
      </section>

      <section class="section">
        <h2 class="section-title">3. 배경 편집</h2>
        <div class="section-help">아이폰과 메시지 화면의 색상을 설정하세요.</div>
        <div class="field color-row"><label>배경 색상</label><input type="color" id="bgColor" value="#B7C2D2"></div>
        <div class="field color-row"><label>배경 하단 색상</label><input type="color" id="bgColor2" value="#A8B6C8"></div>
        <div class="field">
          <label>아이폰 베젤</label>
          <select id="bezelColor"><option value="black">블랙</option><option value="white">화이트</option></select>
        </div>
        <div class="field color-row"><label>우측 말풍선 색상</label><input type="color" id="bubbleColor" value="#3E76CB"></div>
      </section>
    </aside>

    <section class="preview-panel">
      <div class="preview-title">실시간 미리보기</div>
      <div class="preview-help">입력한 내용이 실시간으로 반영됩니다.</div>
      <div class="phone-wrap" id="captureArea">
        <div class="phone black" id="phone">
          <div class="camera"></div>
          <div class="screen">
            <div class="imsg" id="imsg">
              <div class="statusbar"></div>
              <div class="header">
                <div class="nav"><div><span class="back">‹</span><span class="unread" id="previewUnread">105</span></div></div>
                <div class="contact"><div class="contact-placeholder" id="contactPlaceholder"></div><img id="contactImage" class="hidden"><div class="contact-name" id="previewName">이름 ›</div><div class="date" id="previewDate">Thursday, 20 April 2017</div></div>
              </div>
              <div class="messages" id="previewMessages"></div>
              <div class="composer"><div class="plus">＋</div><div class="input-pill" id="previewComposer">iMessage</div></div>
            </div>
          </div>
          <div class="home"></div>
        </div>
      </div>
    </section>
  </main>
  <div class="footer">© 2026 iMessage Skin Editor. All rights reserved.</div>
</div>

<script>
const state={messages:[
  {side:'right',text:"I'm fine, I'll be home soon\\nIt's a cold and starry night.",time:'11:48 PM',showTime:true,image:null},
  {side:'left',text:"Time's we've swallowed up\\nIn spaces we're in a million miles away",time:'11:49 PM',showTime:true,image:null},
  {side:'right',text:"There's things I wish I knew\\nThere's nothing I'd keep from you\\nIt's a dark and empty place",time:'11:49 PM',showTime:true,image:null},
  {side:'left',text:"But with you my dear\\nI'm safe and we're a million miles away",time:'11:49 PM',showTime:true,image:null}
]};

const $=s=>document.querySelector(s);
const messageList=$('#messageList'), previewMessages=$('#previewMessages');

function safe(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function dateText(){return `${$('#dateDay').value}, ${$('#dateNum').value} ${$('#dateMonth').value} ${$('#dateYear').value}`}

function renderMessages(){
  previewMessages.innerHTML='';
  state.messages.forEach((m,i)=>{
    const row=document.createElement('div'); row.className='bubble-row '+m.side;
    const bubble=document.createElement('div'); bubble.className='bubble '+m.side;
    bubble.textContent=m.text;
    if(m.image){const img=document.createElement('img');img.className='shared-image';img.src=m.image;bubble.appendChild(img)}
    if(m.side==='left'){
      row.appendChild(bubble);
      if(m.showTime){const t=document.createElement('span');t.className='time';t.textContent=m.time;row.appendChild(t)}
    }else{
      if(m.showTime){const t=document.createElement('span');t.className='time';t.textContent=m.time;row.appendChild(t)}
      row.appendChild(bubble);
    }
    previewMessages.appendChild(row);
  });
  renderMessageEditors();
}
function renderMessageEditors(){
  messageList.innerHTML='';
  state.messages.forEach((m,i)=>{
    const card=document.createElement('div');card.className='message-card';
    card.innerHTML=`<div class="message-card-head"><b style="font-size:12px">${i+1}. 말풍선</b><button class="small-btn danger" data-del="${i}" ${state.messages.length===1?'disabled':''}>삭제</button></div>
      <div class="inline"><div class="field"><label>위치</label><select data-side="${i}"><option value="left">좌측</option><option value="right">우측</option></select></div><div class="field"><label>시간 표시</label><select data-show="${i}"><option value="true">표시</option><option value="false">숨김</option></select></div></div>
      <div class="field"><label>메시지</label><textarea data-text="${i}"></textarea></div>
      <div class="inline"><div class="field"><label>시간 HH:MM AM/PM</label><input data-time="${i}" placeholder="11:49 PM"></div><div class="field"><label>이미지 공유</label><input type="file" accept="image/*" data-image="${i}"></div></div>`;
    messageList.appendChild(card);
    card.querySelector(`[data-side="${i}"]`).value=m.side;
    card.querySelector(`[data-show="${i}"]`).value=String(m.showTime);
    card.querySelector(`[data-text="${i}"]`).value=m.text;
    card.querySelector(`[data-time="${i}"]`).value=m.time;
  });
}
messageList.addEventListener('input',e=>{
  const key=Object.keys(e.target.dataset)[0]; if(!key)return;
  const i=Number(e.target.dataset[key]); if(key==='text')state.messages[i].text=e.target.value;if(key==='time')state.messages[i].time=e.target.value;
  renderMessagesPreviewOnly();
});
messageList.addEventListener('change',e=>{
  const key=Object.keys(e.target.dataset)[0]; if(!key)return; const i=Number(e.target.dataset[key]);
  if(key==='side')state.messages[i].side=e.target.value;
  if(key==='show')state.messages[i].showTime=e.target.value==='true';
  if(key==='image' && e.target.files[0]){const r=new FileReader();r.onload=()=>{state.messages[i].image=r.result;renderMessages()};r.readAsDataURL(e.target.files[0]);return}
  renderMessages();
});
messageList.addEventListener('click',e=>{if(e.target.dataset.del!==undefined && state.messages.length>1){state.messages.splice(Number(e.target.dataset.del),1);renderMessages()}});
function renderMessagesPreviewOnly(){
  previewMessages.innerHTML='';
  state.messages.forEach(m=>{
    const row=document.createElement('div');row.className='bubble-row '+m.side;
    const bubble=document.createElement('div');bubble.className='bubble '+m.side;bubble.textContent=m.text;
    if(m.image){const img=document.createElement('img');img.className='shared-image';img.src=m.image;bubble.appendChild(img)}
    const t=document.createElement('span');t.className='time';t.textContent=m.time;
    if(m.side==='left'){row.append(bubble);if(m.showTime)row.append(t)}else{if(m.showTime)row.append(t);row.append(bubble)}
    previewMessages.append(row);
  });
}
$('#addMessage').onclick=()=>{state.messages.push({side:'left',text:'새 메시지를 입력하세요.',time:'11:49 PM',showTime:true,image:null});renderMessages()};
$('#profileImage').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{contactImage.src=r.result;profileThumb.src=r.result;contactImage.classList.remove('hidden');profileThumb.classList.remove('hidden');contactPlaceholder.classList.add('hidden');const p=$('#editorAvatarPlaceholder');if(p)p.classList.add('hidden');profileHint.textContent='이미지 적용됨'};r.readAsDataURL(f)});
['profileName','unreadCount','dateDay','dateNum','dateMonth','dateYear','composerText'].forEach(id=>$('#'+id).addEventListener('input',()=>{
  previewName.textContent=$('#profileName').value+' ›';previewUnread.textContent=$('#unreadCount').value;previewDate.textContent=dateText();previewComposer.textContent=$('#composerText').value;
}));

$('#bezelColor').addEventListener('change',e=>{phone.classList.toggle('white',e.target.value==='white');phone.classList.toggle('black',e.target.value==='black')});
function download(name,href){const a=document.createElement('a');a.download=name;a.href=href;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000)}
function exportHTML(){
  // 외부 편집기 없이 붙여넣을 수 있도록 현재 미리보기의 구조/스타일을 인라인 HTML로 생성
  const clone=phone.cloneNode(true);
  clone.querySelector('.screen').style.position='relative';
  clone.style.margin='0 auto';
  clone.querySelectorAll('img').forEach(img=>{if(!img.src)img.remove()});
  const css=`*{box-sizing:border-box}.bubble{position:relative;overflow:visible}.bubble.left:after{content:"";position:absolute;left:-6px;bottom:5px;width:11px;height:14px;background:linear-gradient(135deg,#f0f0f0,#e1e1e1);border-left:1px solid #a8adb4;border-bottom:1px solid #a8adb4;transform:skewY(-28deg)}.bubble.right:after{content:"";position:absolute;right:-6px;bottom:5px;width:11px;height:14px;background:linear-gradient(135deg,${$('#bubbleColor').value},#214f8e);border-right:1px solid #1d467d;border-bottom:1px solid #1d467d;transform:skewY(28deg)}.phone{width:348px;height:742px;border-radius:48px;padding:8px;background:${$('#bezelColor').value==='white'?'#f6f6f6':'#050607'};border:2px solid #75808b;box-shadow:0 6px 14px rgba(0,0,0,.28);position:relative}.phone:before{content:"";position:absolute;width:76px;height:5px;border-radius:4px;top:54px;left:50%;transform:translateX(-50%);background:#25282c;z-index:3}.camera{position:absolute;width:13px;height:13px;border-radius:50%;top:29px;left:50%;transform:translateX(-50%);background:#0d1825;z-index:3}.screen{position:absolute;left:18px;right:18px;top:99px;bottom:96px;border:2px solid #303840;overflow:hidden;background:#c8d0dc}.imsg{height:100%;display:flex;flex-direction:column;background:linear-gradient(${$('#bgColor').value}},${$('#bgColor2').value})}.statusbar{height:8px;flex:0 0 8px}.header{padding:7px 10px 0;border-bottom:1px solid rgba(65,76,89,.18);background:rgba(255,255,255,.12)}.nav{height:34px;display:flex;align-items:center;justify-content:space-between;color:#252a30}.back{font-size:24px;line-height:1}.unread{font-size:19px;margin-left:3px}.header-icons{font-size:24px;letter-spacing:3px}.contact{text-align:center;padding-bottom:7px}.contact img,.contact-placeholder{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#c9ccd0;display:block;margin:0 auto 2px}.contact-placeholder:before{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#74777b;margin:10px auto 2px}.contact-placeholder:after{content:"";display:block;width:36px;height:16px;border-radius:20px 20px 6px 6px;background:#74777b;margin:auto}.contact-name{font-weight:800;font-size:14px}.date{font-size:9px;color:#67717c;margin-top:5px}.messages{flex:1;overflow-y:auto;padding:10px 9px 6px}.bubble-row{display:flex;align-items:flex-end;gap:5px;margin:7px 0}.bubble-row.right{justify-content:flex-end}.bubble-row.left{justify-content:flex-start}.bubble{max-width:78%;padding:8px 10px;border-radius:17px;font-size:11px;line-height:1.22;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.2)}.bubble.left{background:linear-gradient(#fff,#e6e7e8);border:1px solid #9ba3aa;color:#32373b}.bubble.right{color:#fff;background:linear-gradient(145deg,${$('#bubbleColor').value},#214f8e);border:1px solid #1d467d}.time{font-size:8px;color:#68727c;white-space:nowrap;margin-bottom:3px}.shared-image{max-width:100%;display:block;border-radius:10px;margin-top:6px}.composer{border-top:2px solid #434a50;background:#f4f4f4;padding:7px 9px;display:flex;align-items:center;gap:8px}.plus{font-size:28px;line-height:25px;color:#1e252b}.input-pill{height:29px;flex:1;border-radius:15px;background:#dedede;padding:5px 12px;font-size:15px;font-family:cursive;color:#222}.home{position:absolute;width:68px;height:68px;border-radius:50%;bottom:16px;left:50%;transform:translateX(-50%);border:3px solid #3d454e}`;
  const doc=`<!doctype html><html><head><meta charset="utf-8"><style>${css}
/* ===== compact profile ===== */
.profile-section{padding-top:16px;padding-bottom:16px}
.profile-compact{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center}
.profile-upload-wrap{min-width:0}

.compact-placeholder:before{width:24px!important;height:24px!important;margin:12px auto 3px!important}
.compact-placeholder:after{width:42px!important;height:18px!important}
.hidden-file{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.upload-label{display:inline-block;padding:6px 8px;text-align:center}
.profile-hint{display:block;font-size:10px;color:#7c8794;margin-top:4px;text-align:center}
.profile-fields{display:grid;grid-template-columns:1fr;gap:2px}
.profile-fields .field{margin:4px 0}

/* ===== classic iMessage bubble ===== */
.bubble{
  position:relative;
  overflow:visible;
  max-width:76%;
  padding:8px 11px;
  border-radius:17px;
  font-size:11px;
  line-height:1.25;
  white-space:pre-wrap;
  word-break:break-word;

    inset 0 1px 0 rgba(255,255,255,.58),

  content:"";
  position:absolute;
  left:-6px;
  bottom:5px;

  background:linear-gradient(135deg,#f0f0f0 0%,#e1e1e1 100%);

  color:#ffffff;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--bubble-color,#3e76cb) 72%,#ffffff) 0%,

      color-mix(in srgb,var(--bubble-color,#3e76cb) 72%,#123d78) 100%);

}

  content:"";
  position:absolute;
  right:-6px;
  bottom:5px;
  width:11px;
  height:14px;
  background:linear-gradient(135deg,

  border-right:1px solid color-mix(in srgb,var(--bubble-color,#3e76cb) 58%,#173d70);
  border-bottom:1px solid color-mix(in srgb,var(--bubble-color,#3e76cb) 58%,#173d70);
  transform:skewY(28deg);
  border-bottom-right-radius:2px;
  z-index:0;
}
.bubble.right:before{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  width:8px;
  height:13px;
  background:color-mix(in srgb,var(--bubble-color,#3e76cb) 78%,#153e73);
  z-index:1;
}
.bubble > *{position:relative;z-index:2}
.bubble-row{margin:9px 0}
.shared-image{position:relative;z-index:2}

/* 연락처 영역도 조금 축소 */
.contact img,.contact-placeholder{width:48px;height:48px}
.contact-placeholder:before{margin:8px auto 2px}
.contact-placeholder:after{width:33px;height:15px}

/* 전화/통화 관련 기호 제거 */
.header-icons{display:none!important}
.nav{justify-content:flex-start}

</style></head><body style="margin:0;padding:20px;background:#f5f6f8"><div style="width:348px;margin:auto">${clone.outerHTML}</div></body></html>`;
  const blob=new Blob([doc],{type:'text/html;charset=utf-8'});download('imessage-skin.html',URL.createObjectURL(blob));
}
$('#htmlExport').onclick=exportHTML;
$('#pngExport').onclick=async()=>{
  const oldScroll=previewMessages.scrollTop;
  // PNG는 실제 미리보기 화면에서 보이는 현재 스크롤 위치만 캡처
  const canvas=await html2canvas(phone,{backgroundColor:null,scale:2,useCORS:true,allowTaint:false,logging:false});
  canvas.toBlob(blob=>download('imessage-skin.png',URL.createObjectURL(blob)),'image/png');
  previewMessages.scrollTop=oldScroll;
};
renderMessages();
</script>
